<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #07131d;
      --bg-card: #0d2232;
      --border: #0e8354;
      --border-soft: #173b52;
      --accent: #00d68f;
      --highlight: #00a3e0;
      --text: #e2e8f0;
      --muted: #8ea3b7;
      --code-bg: #040d14;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 10px;
      background: var(--bg-main); 
      color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      font-size: 11.5px;
    }

    .header {
      font-weight: bold; 
      margin-bottom: 8px; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-badge {
      background: #064e3b;
      color: #6ee7b7;
      border: 1px solid #059669;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #107c41;
      display: inline-block;
      box-shadow: 0 0 6px rgba(16, 124, 65, 0.5);
    }
    .section-box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 3px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 7px;
    }
    .section-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 6px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Category Dropdown Filter */
    select.category-select {
      width: 100%;
      background: #040d14;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: bold;
      outline: none;
      margin-bottom: 6px;
    }

    .chip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
    }
    .btn-chip {
      background: #102a3d;
      border: 1px solid var(--border-soft);
      color: var(--text);
      padding: 5px 6px;
      border-radius: 4px;
      font-size: 9px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .btn-chip:hover {
      background: var(--border);
      color: white;
      border-color: var(--accent);
    }
    .btn-chip.active-running {
      border-color: var(--highlight);
      background: #0284c7;
      color: white;
    }

    /* Latest Case Card */
    .latest-case-card {
      background: var(--code-bg);
      border: 1px solid var(--border-soft);
      border-radius: 5px;
      padding: 6px 8px;
      margin-top: 5px;
      font-size: 10px;
      display: none;
    }
    .latest-case-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2px;
    }

    .notes-textarea {
      width: 100%;
      height: 75px;
      background: var(--code-bg);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      color: var(--highlight);
      font-family: monospace;
      font-size: 10px;
      padding: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    .counter-bar {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: var(--muted);
      margin-top: 2px;
      margin-bottom: 4px;
    }
    .date-row {
      display: flex;
      gap: 4px;
      align-items: center;
      margin-bottom: 5px;
    }
    input[type="date"] {
      background: #040d14;
      color: var(--text);
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 3px 5px;
      outline: none;
      box-sizing: border-box;
      font-size: 10px;
      color-scheme: dark;
      flex: 1;
    }
    .buttons-row {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    button.btn-action {
      flex: 1;
      padding: 5px 6px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      font-size: 9.5px;
      transition: opacity 0.2s ease;
    }
    button.btn-action:hover { opacity: 0.9; }
    .btn-copy { background-color: #0284c7; }
    .btn-paste-dce { background-color: #7c3aed; }
    .btn-clear { background-color: #991b1b; }
    .btn-scan { background-color: #0d9488; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #040d14;
      border: 1px solid var(--border-soft);
      border-radius: 4px;
      padding: 4px 8px;
      margin-top: 6px;
      font-size: 9.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 6px;">
      <span>DCE Assistant</span>
      <span class="header-badge">AGENT PRO</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span id="lbl-engine-state" style="font-size: 9px; color: var(--muted);">Ready</span>
      <span id="status-dot" class="status-dot"></span>
    </div>
  </div>

  <!-- Latest Ticket Finder & Notes Log Opener -->
  <div class="section-box">
    <div class="section-title">
      <span>Latest Ticket & Notes Log Lookup</span>
      <span id="lbl-scan-status" style="font-size: 9px; color: var(--muted);">Idle</span>
    </div>
    <div class="buttons-row">
      <button id="btn-scan-latest-open" class="btn-action btn-scan">📂 Open Latest (Open)</button>
      <button id="btn-scan-latest-closed" class="btn-action btn-scan" style="background: #1e3a5f;">📁 Open Latest (Closed)</button>
    </div>
    <div id="latest-case-card" class="latest-case-card">
      <div class="latest-case-row">
        <span style="color: var(--muted);">Ticket Ref:</span>
        <b id="disp-ticket-ref" style="color: var(--highlight);">--</b>
      </div>
      <div class="latest-case-row">
        <span style="color: var(--muted);">Case Title:</span>
        <span id="disp-case-title" style="color: #fff; font-weight: bold;">--</span>
      </div>
      <div class="latest-case-row">
        <span style="color: var(--muted);">Created Date:</span>
        <span id="disp-case-date" style="color: var(--accent);">--</span>
      </div>
      <div class="latest-case-row">
        <span style="color: var(--muted);">Case Creator:</span>
        <span id="disp-case-creator" style="color: #fef08a;">--</span>
      </div>
    </div>
  </div>

  <!-- Organized 2-Tier Presets (Dropdown + Filtered Buttons) -->
  <div class="section-box">
    <div class="section-title">
      <span>Case Categorization Pipeline</span>
      <span id="lbl-presets-count" style="color: var(--highlight); font-size: 9.5px;">0 Loaded</span>
    </div>
    <select id="select-category-filter" class="category-select">
      <option value="ALL">📁 All Presets (Show All)</option>
    </select>
    <div class="chip-grid" id="disposition-chips"></div>
  </div>

  <!-- Call Notes Staging Area -->
  <div class="section-box">
    <div class="section-title">
      <span>Call Notes Staging Area</span>
      <span id="copy-feedback" style="color: #4ade80; font-size: 10px; display: none;">Copied!</span>
    </div>

    <div class="date-row">
      <input type="date" id="rfp-calendar-input">
      <button id="btn-insert-date" class="btn-action" style="flex: 0 0 85px; background: #0d9488;">Set RFP Date</button>
      <button id="btn-today-date" class="btn-action" style="flex: 0 0 50px; background: #334155;">Today</button>
    </div>

    <textarea id="txt-call-notes" class="notes-textarea" placeholder="Select a preset above to auto-draft notes..."></textarea>
    
    <div class="counter-bar">
      <span id="lbl-chars-count">0 chars</span>
      <span id="lbl-words-count">0 words</span>
    </div>

    <div class="buttons-row">
      <button id="btn-copy-notes" class="btn-action btn-copy">📋 Copy Notes</button>
      <button id="btn-paste-to-dce" class="btn-action btn-paste-dce">📥 Insert to Notes Log</button>
      <button id="btn-clear-notes" class="btn-action btn-clear" style="flex: 0 0 45px;">Clear</button>
    </div>
  </div>

  <!-- Locked Master Config Bar -->
  <div class="status-bar">
    <span id="lbl-package-ver">Package: Initializing...</span>
    <label class="btn-action btn-scan" style="padding: 2px 8px; cursor: pointer; text-align: center; flex: 0 0 auto;">
      📂 Update Config
      <input type="file" id="input-import-profiles" accept=".json" style="display: none;">
    </label>
  </div>

  <script src="panel.js"></script>
</body>
</html>
